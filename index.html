<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION CLOCK // CLASSIFIED</title>
<style>
  :root {
    --bg: #010502;
    --fg: #33ff66;
    --dim: #1a8a3d;
    --alert: #ff3b3b;
    --scan-opacity: 0.06;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  /* CRT scanlines */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(51, 255, 102, var(--scan-opacity)) 0px,
      rgba(51, 255, 102, var(--scan-opacity)) 1px,
      transparent 2px,
      transparent 4px
    );
    z-index: 2;
  }
  /* subtle flicker/vignette */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    z-index: 1;
  }
  .panel {
    position: relative;
    z-index: 3;
    border: 1px solid var(--dim);
    padding: 32px clamp(16px, 5vw, 56px);
    max-width: 720px;
    width: 100%;
    box-shadow: 0 0 20px rgba(51,255,102,0.15), inset 0 0 30px rgba(51,255,102,0.05);
    background: rgba(0, 10, 2, 0.4);
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin-bottom: 20px;
    border-bottom: 1px dashed var(--dim);
    padding-bottom: 10px;
  }
  .blink {
    animation: blink 1.4s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0.15; }
  }
  h1 {
    font-size: clamp(1rem, 3.5vw, 1.6rem);
    margin: 0 0 6px;
    color: var(--fg);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(51,255,102,0.6);
  }
  .subtitle {
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  #countdown {
    display: flex;
    gap: clamp(8px, 3vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 78px;
    border: 1px solid var(--dim);
    padding: 12px 8px;
    background: rgba(51,255,102,0.03);
  }
  .value {
    font-size: clamp(2.2rem, 9vw, 4.2rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    line-height: 1;
    text-shadow: 0 0 10px rgba(51,255,102,0.7);
  }
  .label {
    margin-top: 8px;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #finished {
    display: none;
    font-size: clamp(1.3rem, 5.5vw, 2.4rem);
    font-weight: 700;
    color: var(--alert);
    text-shadow: 0 0 12px rgba(255,59,59,0.8);
    letter-spacing: 0.1em;
  }
  #eventInfo {
    margin-top: 24px;
    color: var(--dim);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }
  .stamp {
    margin-top: 18px;
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.2em;
    border-top: 1px dashed var(--dim);
    padding-top: 10px;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <span>SEC-LEVEL: TOP SECRET</span>
      <span class="blink">● REC</span>
      <span id="clockNow">--:--:--</span>
    </div>
    <h1 id="eventTitle">MISSION TIMER</h1>
    <div class="subtitle">SELF-DESTRUCT SEQUENCE // TIME REMAINING</div>
    <div id="countdown">
      <div class="unit"><div class="value" id="days">00</div><div class="label">Days</div></div>
      <div class="unit"><div class="value" id="hours">00</div><div class="label">Hrs</div></div>
      <div class="unit"><div class="value" id="minutes">00</div><div class="label">Min</div></div>
      <div class="unit"><div class="value" id="seconds">00</div><div class="label">Sec</div></div>
    </div>
    <div id="finished">⚠ MISSION WINDOW CLOSED ⚠</div>
    <div id="eventInfo"></div>
    <div class="stamp">THIS MESSAGE WILL SELF-DESTRUCT AT ZERO HOUR</div>
  </div>

<script>
  // ---- Configure your event here ----
  const EVENT_NAME = "Hackathon";
  const END_DATE = "2026-09-18T13:00:00"; // local time, ISO format YYYY-MM-DDTHH:MM:SS
  // ------------------------------------

  document.getElementById("eventTitle").textContent = `${EVENT_NAME.toUpperCase()} // T-MINUS`;
  document.getElementById("eventInfo").textContent =
    "EXTRACTION TIME: " + new Date(END_DATE).toLocaleString();

  const endTime = new Date(END_DATE).getTime();

  function updateClock() {
    document.getElementById("clockNow").textContent = new Date().toLocaleTimeString();
  }

  function update() {
    const now = Date.now();
    const diff = endTime - now;

    if (diff <= 0) {
      document.getElementById("countdown").style.display = "none";
      document.getElementById("finished").style.display = "block";
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = String(days).padStart(2, "0");
    document.getElementById("hours").textContent = String(hours).padStart(2, "0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
  }

  updateClock();
  update();
  setInterval(updateClock, 1000);
  const timer = setInterval(update, 1000);
</script>
</body>
</html>
